name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Heroku (Backend)
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        HEROKU_APP_NAME_SERVER: splitbill-server
      run: |
        git remote add heroku https://git.heroku.com/$HEROKU_APP_NAME_SERVER.git
        git push heroku main
      if: env.HEROKU_API_KEY != ''
    
    - name: Deploy to Vercel (Frontend)
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        npm i -g vercel
        vercel --prod --token $VERCEL_TOKEN
      if: env.VERCEL_TOKEN != ''
    
    - name: Notify Slack
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "SplitBill deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "✅ SplitBill Deployment Successful\n*Commit:* ${{ github.sha }}"
                }
              }
            ]
          }
      if: success()
